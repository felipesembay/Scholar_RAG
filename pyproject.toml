[project]
name = "scholar-rag"
version = "0.1.0"
description = "RAG para pesquisa e escrita acadêmica"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu==1.10.0",
    "langchain==0.3.18",
    "langchain-community==0.3.17",
    "langchain-core==0.3.35",
    "langchain-huggingface==0.1.2",
    "langchain-text-splitters==0.3.6",
    "odfpy==1.4.1",
    "openai==1.63.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pdfplumber==0.11.5",
    "python-docx==1.1.2",
    "PyYAML==6.0.2",
    "Unidecode==1.3.8",
    "openpyxl==3.1.5",
    "cryptography==44.0.1",
    "uvicorn==0.34.0",
    "pytesseract==0.3.13",
    "pillow==11.1.0",
    "docling==2.34.0",
    "pydantic==2.10.6",
    "fastapi==0.115.8",
    "python-multipart==0.0.20",
    "pymupdf==1.25.5",
    "python-dotenv==1.0.1",
    "elasticsearch>=8.19,<9",
]

[dependency-groups]
dev = [
    "pytest==8.4.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "rapidfuzz>=3.14.6",
    "reportlab==4.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["src/turnover", "notebooks", "debug"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
