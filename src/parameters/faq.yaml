faq:
  - question: "O que é o ScholarRAG?"
    answer: "Um assistente de pesquisa e escrita acadêmica baseado em RAG (Retrieval-Augmented Generation). Ele responde perguntas, redige e revisa o artigo com citações vinculadas aos documentos do seu projeto."
  - question: "O que é RAG (Retrieval-Augmented Generation)?"
    answer: "Uma técnica que combina a busca de trechos relevantes nos seus documentos (busca híbrida no Elasticsearch) com a geração de texto por um LLM. O modelo responde com base no que foi recuperado, o que aumenta a precisão e permite citar a fonte."
  - question: "Como as citações são geradas?"
    answer: "O modelo só indica fontes numeradas, como [1] ou [2, 3]. Autor, ano, página e a lista de referências são montados por código a partir da Biblioteca do projeto (ABNT ou APA), então uma referência inventada não chega ao texto."
  - question: "Como crio um projeto?"
    answer: "Em 'Projetos', clique em 'Criar novo projeto', informe o nome, envie os documentos (PDF, Word, PowerPoint, planilhas, notebooks, scripts, imagens ou um ZIP com pastas) e salve. Bases grandes levam alguns minutos para indexar."
  - question: "Qual a diferença entre Literatura, Material de apoio e Seus resultados?"
    answer: "Literatura são obras citáveis e entram nas referências. Material de apoio (aulas, slides, códigos, dados) é usado como contexto e nunca é citado como obra. Seus resultados (arquivos .md enviados na Biblioteca) aparecem como 'resultados desta pesquisa'."
  - question: "Como escrevo o artigo?"
    answer: "Em 'Escrita do artigo', comece em branco ou pela estrutura padrão, importe seu rascunho (Word, PDF ou Markdown), gere ou continue cada seção, use 'Analisar' para revisar e exporte em DOCX, Markdown ou LaTeX."
  - question: "Como vejo métricas de uso?"
    answer: "Na aba 'Dashboard' há gráficos de projetos, documentos e interações com o chat."
  - question: "Os documentos são atualizados automaticamente?"
    answer: "Não. Para incluir novos documentos, atualize o projeto em 'Projetos' enviando os arquivos novos."
